name: Deploy to GitHub Pages

# master ブランチに対する PR が merge された時のみ実行される
on:
  pull_request:
    branches:
      - master
    types: [closed]
    paths-ignore:
      - './assets/date.json' # date.json 自身の変更ではトリガーしない

jobs:
  build:
    if: |
      github.repository == 'roratorio-hub/ratorio' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # リポジトリのコードを取得
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # PR に release ラベルが付与されている時のみ PR がマージされた日時を json に書き出す
      - name: Get and format PR merged date in JST
        if: contains(github.event.pull_request.labels.*.name, 'release')
        id: get_formatted_pr_date
        run: |
          JST_DATE=$(TZ="Asia/Tokyo" date +"%Y-%m-%d %H:%M")
          echo "{\"release_date\": \"$JST_DATE\"}" > ./assets/date.json

      # PR に release ラベルが付与されている時のみ json をコミットする
      - name: Commit and push if changed
        if: contains(github.event.pull_request.labels.*.name, 'release')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./assets/date.json
          git commit -m "リリース日時の更新"
          git push

      # リポジトリルートの内容を GitHub Pages にデプロイ（exclude_assets 記載分を除く）
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./  # ルートディレクトリをコピーする
          exclude_assets: '.circleci,.github,.gemini,.vscode,node_modules,.gitignore,解析メモ,util,tests'
